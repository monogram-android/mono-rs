[package]
name = "mono-proto-client"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[features]
test-support = []

[dev-dependencies]
sha2 = "0.11"

[dependencies]
zeroize = "1"
serde_json = "1"
parking_lot = "0.12"
mono-proto-types = { path = "../mono-proto-types" }
mono-proto-crypto = { path = "../mono-proto-crypto" }
mono-proto = { path = "../mono-proto" }
mono-proto-transport = { path = "../mono-proto-transport" }
mono-proto-updates = { path = "../mono-proto-updates" }
mono-proto-messages = { path = "../mono-proto-messages" }
mono-proto-media = { path = "../mono-proto-media" }
mono-proto-runtime = { path = "../mono-proto-runtime" }
mono-proto-session = { path = "../mono-proto-session" }
mono-proto-storage = { path = "../mono-proto-storage" }
mono-proto-observability = { path = "../mono-proto-observability" }
mono-proto-socket = { path = "../mono-proto-socket" }
