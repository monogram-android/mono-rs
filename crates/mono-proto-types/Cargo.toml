[package]
name = "mono-proto-types"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[dependencies]
compact_str = { version = "0.9", features = ["serde"] }
indexmap = "2"
rapidhash = "4"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
mono-proto = { path = "../mono-proto" }
