[package]
name = "mono-proto-messages"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mono-proto = { path = "../mono-proto" }
mono-proto-crypto = { path = "../mono-proto-crypto" }
mono-proto-media = { path = "../mono-proto-media" }
mono-proto-runtime = { path = "../mono-proto-runtime" }
mono-proto-session = { path = "../mono-proto-session" }
mono-proto-types = { path = "../mono-proto-types" }
