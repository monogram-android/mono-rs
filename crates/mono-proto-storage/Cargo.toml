[package]
name = "mono-proto-storage"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "GPL-3.0-only"
publish = false

[features]
test-support = []

[dependencies]
aes-gcm = "0.11"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
mono-proto-crypto = { path = "../mono-proto-crypto" }
mono-proto-observability = { path = "../mono-proto-observability" }
mono-proto-session = { path = "../mono-proto-session" }
mono-proto-types = { path = "../mono-proto-types" }
